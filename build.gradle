plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
}

group = 'recordbase'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    String javaFxVersion = '25.0.2'
    String osName = System.getProperty('os.name').toLowerCase()
    String architecture = System.getProperty('os.arch').toLowerCase()
    String javaFxPlatform = osName.contains('win') ? 'win' : osName.contains('mac') ? 'mac' : 'linux'
    if (architecture.contains('aarch64') || architecture.contains('arm64')) {
        javaFxPlatform += '-aarch64'
    }
    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}")
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainModule = 'my.record.app'
    mainClass = 'recordbase.ui.Launcher'
    // JavaFX calls native windowing code, which Java 25 requires applications to authorize explicitly.
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jar {
    // A modular launch uses this lean JAR; the separate shadow JAR remains available for distribution.
    enabled = true
    // Keep it distinct from the shadow JAR that packages the runtime dependencies.
    archiveClassifier = 'without-dependencies'
}

// shadowJar {
//     archiveFileName = 'record.jar'
// }
tasks.named('shadowJar') {
    archiveBaseName = 'record'
    archiveVersion = project.version.toString()
    archiveClassifier = 'all'

    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

checkstyle {
    // toolVersion = '11.0.0'
    toolVersion = '13.11.0' // Update to support Java 25 syntax. Else, assertions will cause build failures
    //toolVersion = '14.1.0' // Update to support Java 25 syntax. Else, assertions will cause build failures
}

// The course Checkstyle grammar does not parse Java module descriptors; javac still validates this file.
tasks.named('checkstyleMain') {
    exclude '**/module-info.java'
}

run {
    standardInput = System.in
}

tasks.named('run') {
    standardInput = System.in
}

tasks.named('test') {
    useJUnitPlatform()
}
